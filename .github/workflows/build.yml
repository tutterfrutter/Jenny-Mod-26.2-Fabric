name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Resolve mod version
        id: modversion
        run: |
          V=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fapcraft-jenny-fabric-26.2-${{ steps.modversion.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
